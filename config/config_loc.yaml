# map_path: path to the voxel_map.bin produced by dr_map / dr_ba
map_path: /home/asrl/ros2_ws/src/dre/output/maps/boreas-2025-02-22-12-18/voxel_map.bin
# map_path: /home/asrl/ros2_ws/install/dre/share/dre/output/boreas-live/voxel_map.bin

# Localization visualization parameters
loc_viz:
  scan_res: 0.1               # m / pixel — must match the scan publisher
  scan_display_radius_m: 100.0 # clip scan circle to this radius (metres)
  veh_len: 6.0                # vehicle length for pose triangles (metres)
  veh_wid: 3.0                # vehicle width for pose triangles (metres)
  zoom_range: 100.0            # half-width of the view window (meters)
  fig_size_px: 400            # figure size in pixels
  dpi: 100                    # dots per inch

# num_triangles: number of pose trail triangles to display (-1 for unlimited)
num_triangles: 10

# num_threads: number of threads for parallel processing (OpenMP)
num_threads: 12

# init_mode: how initial_pose_selector obtains loc_node's starting pose in the map frame.
#   start    - use x=0, y=0, theta=0 directly, no interaction
#   selector - open the interactive matplotlib map-click selector
#   auto     - automatic initialization via raplace/registration (not implemented yet)
init_mode: selector

frame_processing:
  max_dist: 80.0           # radius (m) around current pose to query map voxels
  gauss_blur_sigma: 3.0    # Gaussian blur kernel sigma (pixels) applied to incoming scan
  gauss_blur_ksize: 9     # Gaussian blur kernel size (must be odd); formula: (int(ceil(3 * sigma)) | 1)
  adaptive_blur: false     # if true, sigma grows until min_percent_nonzero is met
  min_int_val_tol: 0.5     # pixel threshold for counting a pixel as non-zero
  min_percent_nonzero: 0.3 # target non-zero fraction when adaptive_blur is enabled
  max_blur_sigma: 15.0     # upper bound on sigma for adaptive blur

optimization:
  max_iterations: 8
  convergence_tol: 1.0e-3
  alpha: 1.0          # Gauss-Newton step size
  meas_std: 1.0       # intensity measurement noise std-dev (normalised [0,1] scale)
  range_factor: 0.0   # adds range-dependent intensity uncertainty
